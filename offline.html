<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinRide — Offline</title>
  <meta name="theme-color" content="#0C1220" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="offline-page">
  <main class="offline-main">
    <div class="offline-icon" aria-hidden="true">
      <!-- Wifi-off icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>PinRide opened, but the map needs an internet connection to load tiles and search places.</p>
    <p class="offline-note">Navigation is handled by your driver's map app — if they have offline maps, routing still works once a pin is scanned.</p>
    <a href="index.html" class="primary-btn">Try again</a>
  </main>
</body>
</html>
